name: CI

# the actual deploy is Railway's own GitHub integration, triggered independently of this
# workflow - this just runs the test suite and applies migrations to the shared database
# before Railway's deploy (which happens to run in parallel) picks up the new code
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  migrate:
    needs: test
    runs-on: ubuntu-latest
    concurrency: migrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run migrate
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
